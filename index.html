<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>888 Poker - Texas Hold'em</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#1a1a1a;color:#fff}
.topbar{background:#000;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #f5c542}
.logo{font-weight:900;font-size:22px} .logo span{color:#f5c542}
.pill{background:#222;padding:6px 12px;border-radius:20px;font-size:12px}
.lobby{max-width:480px;margin:16px auto;padding:0 12px}
.card{background:#222;border-radius:16px;padding:18px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#000;color:#fff;font-size:16px;margin:8px 0}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;margin:6px 0}
.btn-gold{background:#f5c542;color:#000} .btn-blue{background:#2e7bff;color:#fff} .btn-dark{background:#333;color:#fff}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:10px 0}
.av{font-size:24px;padding:10px 0;background:#000;border:2px solid #444;border-radius:12px;cursor:pointer;text-align:center}
.av.sel{border-color:#f5c542;background:#4a3a00}
.game{display:none;max-width:520px;margin:0 auto;padding:8px 10px 20px}
.infoBar{display:flex;justify-content:space-between;background:#222;padding:10px;border-radius:12px;font-size:13px}
.infoBar b{color:#f5c542;letter-spacing:2px}
.adminBar{background:#f5c542;color:#000;border-radius:12px;padding:10px;font-weight:800;text-align:center;margin:8px 0;display:none}
.msg{text-align:center;font-weight:700;font-size:14px;min-height:22px;margin:8px 0;color:#ffe27a}

/* MESA ARREGLADA - COLORES PLANOS, SE VE SEGURO */
.table{position:relative;height:500px;margin:12px 0;background:#5a2e12;border-radius:60px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.felt{position:absolute;inset:16px;background:#0f7a3d;border-radius:50px;border:3px solid #ffe27a;overflow:hidden}
.feltLogo{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,.18);font-weight:900;font-size:22px;letter-spacing:3px;line-height:1.2}
.center{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;width:100%;z-index:3}
.pot{font-weight:900;font-size:18px;text-shadow:0 2px 4px #000}.pot span{color:#ffe27a;font-size:22px}
.community{display:flex;gap:6px;justify-content:center;margin:10px 0;min-height:64px}
.carta{width:46px;height:64px;background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 4px 8px rgba(0,0,0,.5)}
.carta small{font-size:13px} .carta.roja{color:#d21f2b} .carta.back{background:#b91c1c;color:#fff}
.seat{position:absolute;width:96px;z-index:5;text-align:center;transform:translate(-50%,-50%)}
.seat .ava{width:54px;height:54px;border-radius:50%;background:#111;border:3px solid #fff;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.6);position:relative}
.seat.active .ava{border-color:#f5c542;box-shadow:0 0 0 3px #f5c542}
.seat.out{opacity:.4}
.seat .name{font-size:11px;font-weight:800;background:#000;padding:4px 8px;border-radius:20px;display:inline-block;max-width:96px;overflow:hidden;white-space:nowrap}
.seat .stack{font-size:11px;font-weight:800;color:#ffe27a;background:#000;padding:3px 8px;border-radius:20px;display:inline-block}
.seat .bet{font-size:11px;font-weight:900;color:#fff;background:#dc2626;padding:3px 8px;border-radius:20px;display:inline-block;margin-top:2px}
.seat .dealer{position:absolute;top:-6px;right:6px;width:20px;height:20px;background:#fff;color:#000;border-radius:50%;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.seat.me .ava{border-color:#fff;width:60px;height:60px}
.pos0{top:84%;left:50%} .pos1{top:52%;left:90%} .pos2{top:14%;left:76%} .pos3{top:14%;left:24%} .pos4{top:52%;left:10%}
.myZone{background:#222;border-radius:16px;padding:12px;text-align:center}
.myCards{display:flex;gap:10px;justify-content:center;margin:6px 0}
.myCards .carta{width:60px;height:84px;font-size:26px}
.myInfo{font-size:13px;color:#ddd}
.actions{margin-top:10px;display:none}
.row{display:flex;gap:8px}.row .btn{flex:1;padding:14px;font-size:14px}.row input{flex:1.3}
.slider{width:100%;accent-color:#f5c542}
.winner{position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);background:#000;border:2px solid #f5c542;padding:12px;border-radius:12px;font-weight:900;text-align:center;z-index:10;display:none;width:90%}
</style>
</head>
<body>
<div class="topbar"><div class="logo">888 <span>POKER</span></div><div class="pill" id="topSound" onclick="toggleSonido()">🔊 SONIDO ON</div><div class="pill" id="topCode">MESA</div></div>

<div id="lobby" class="lobby"><div class="card">
 <h1 style="text-align:center;margin:0">♠️ Texas Hold'em</h1><p style="text-align:center;color:#aaa;font-size:13px">Mesa privada • 5 jugadores • 1000 fichas</p>
 <input id="miNombre" placeholder="Tu nombre">
 <p style="font-weight:800">Elige tu avatar 👇</p>
 <div class="avatars" id="avatars"></div>
 <p id="avatarSel" style="text-align:center;color:#f5c542">Avatar: 🦁 León</p>
 <button class="btn btn-gold" onclick="crear()">👑 CREAR MESA COMO ADMIN</button>
 <input id="codigoUnirse" placeholder="CÓDIGO, EJ: AB12" style="text-transform:uppercase">
 <button class="btn btn-blue" onclick="unirse()">UNIRSE CON CÓDIGO</button>
 <p id="error" style="color:#ff7b7b;text-align:center;font-weight:700"></p>
</div></div>

<div id="juego" class="game">
 <div class="infoBar"><span>Código: <b id="codigoSala">----</b></span><span id="estado">0/5</span><span id="faseTop">ESPERANDO</span></div>
 <div id="adminPanel" class="adminBar">👑 ERES EL ADMIN<br><button class="btn btn-dark" onclick="empezarMano()">▶️ EMPEZAR MANO</button><button class="btn btn-dark" onclick="nuevaMano()">🔄 NUEVA MANO</button></div>
 <div class="msg" id="mensaje">Esperando jugadores...</div>
 <div class="table"><div class="felt"><div class="feltLogo">888 POKER<br><span style="font-size:11px;letter-spacing:4px">TEXAS HOLD'EM</span></div></div>
  <div id="seats"></div>
  <div class="center"><div class="pot">💰 BOTE <span id="bote">0</span></div><div class="community" id="cartasMesa"></div><div style="font-size:12px">Apuesta: <b id="apuestaActual">0</b> • Mano <span id="numMano">1</span></div></div>
  <div class="winner" id="winnerBox"></div>
 </div>
 <div class="myZone"><div style="font-size:12px;color:#aaa">TUS CARTAS <span id="miAvatarShow"></span></div><div class="myCards" id="misCartas"><p style="color:#888">Esperando reparto...</p></div><div class="myInfo" id="miInfo"></div></div>
 <div class="actions" id="acciones">
  <input type="range" class="slider" id="sliderSubir" min="0" max="1000" step="10" value="100" oninput="document.getElementById('cantidadSubir').value=this.value">
  <div class="row"><button class="btn btn-dark" onclick="accion('pasar')">PASAR</button><button class="btn btn-blue" onclick="accion('igualar')">IGUALAR <span id="txtIgualar"></span></button></div>
  <div class="row"><input id="cantidadSubir" type="number" placeholder="Subir a..."><button class="btn btn-gold" onclick="accion('subir')">SUBIR ⬆️</button></div>
  <div class="row"><button class="btn btn-blue" style="background:#dc2626" onclick="accion('allin')">🔥 ALL-IN</button><button class="btn btn-dark" onclick="accion('retirarse')">RETIRARSE</button></div>
 </div>
 <button class="btn btn-dark" onclick="location.reload()">Salir</button>
</div>

<script>
const URL="PEGA_AQUI_TU_URL_EXEC";
let codigo="", miNombre="", soyAdmin=false, intervalo=null;
let avatarSel="🦁", sonidoOn=true, ultimoBote=0, ultimaMesaLen=0, ultimoMensaje="";
const AVATARES=[["🦁","León"],["🦊","Zorro"],["🐺","Lobo"],["🦅","Águila"],["🐯","Tigre"],["🦈","Tiburón"],["🤖","Robot"],["👑","Rey"],["😎","Cool"],["🤠","Vaquero"],["🦄","Unicornio"],["👽","Alien"],["🐲","Dragón"],["😈","Diablo"],["🥷","Ninja"],["🍀","Suerte"]];
const contAv=document.getElementById('avatars');
AVATARES.forEach(([emoji,nombre])=>{
  const d=document.createElement('div'); d.className='av'+(emoji===avatarSel?' sel':''); d.innerText=emoji;
  d.onclick=()=>{ avatarSel=emoji; document.querySelectorAll('.av').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); document.getElementById('avatarSel').innerText="Avatar: "+emoji+" "+nombre; playChip(); };
  contAv.appendChild(d);
});
function toggleSonido(){ sonidoOn=!sonidoOn; document.getElementById('topSound').innerText= sonidoOn?"🔊 SONIDO ON":"🔇 SONIDO OFF"; if(sonidoOn) playChip(); }
let audioCtx=null;
function playChip(){
  if(!sonidoOn) return;
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume();
    [0,0.08].forEach((delay,i)=>{ const t=audioCtx.currentTime+delay; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='square'; o.frequency.value=2400-i*500; g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.07); });
  }catch(e){}
}
function playCarta(){
  if(!sonidoOn) return;
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(320,t+0.12); g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.13); }catch(e){}
}
function playWin(){
  if(!sonidoOn) return;
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); [523,659,784,1046].forEach((f,i)=>{ const t=audioCtx.currentTime+i*0.13; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.frequency.value=f; g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.3); }); }catch(e){}
}
async function crear(){
  miNombre=document.getElementById('miNombre').value.trim(); if(!miNombre) return alert('Pon tu nombre');
  playChip();
  const r=await fetch(URL,{method:'POST',body:JSON.stringify({action:'crear',nombre:miNombre,avatar:avatarSel})}); const d=await r.json(); if(d.error) return document.getElementById('error').innerText=d.error;
  codigo=d.code; soyAdmin=true; entrar();
}
async function unirse(){
  miNombre=document.getElementById('miNombre').value.trim(); codigo=document.getElementById('codigoUnirse').value.toUpperCase().trim();
  if(!miNombre||!codigo) return alert('Pon nombre y codigo');
  playChip();
  const r=await fetch(URL,{method:'POST',body:JSON.stringify({action:'unirse',code:codigo,nombre:miNombre,avatar:avatarSel})}); const d=await r.json();
  if(d.error) return document.getElementById('error').innerText=d.error;
  soyAdmin=false; entrar();
}
function entrar(){ document.getElementById('lobby').style.display='none'; document.getElementById('juego').style.display='block'; document.getElementById('codigoSala').innerText=codigo; document.getElementById('topCode').innerText=codigo; document.getElementById('adminPanel').style.display= soyAdmin?'block':'none'; document.getElementById('miAvatarShow').innerText=avatarSel; intervalo=setInterval(actualizar,1500); actualizar(); }
function cartaDiv(c){
  const div=document.createElement('div');
  if(c.txt==="🂠"){ div.className='carta back'; div.innerText='🂠'; return div; }
  div.className='carta'+(c.p==='♥'||c.p==='♦'?' roja':''); div.innerHTML=c.v+'<small>'+c.p+'</small>'; return div;
}
async function actualizar(){
  if(!codigo) return;
  const r=await fetch(URL+"?code="+codigo+"&nombre="+encodeURIComponent(miNombre)); const s=await r.json(); if(s.error) return;
  if(s.bote!==ultimoBote){ if(s.bote>ultimoBote) playChip(); ultimoBote=s.bote; }
  if(s.mesa.length!==ultimaMesaLen){ if(s.mesa.length>ultimaMesaLen) playCarta(); ultimaMesaLen=s.mesa.length; }
  if(s.mensaje!==ultimoMensaje){ if(s.mensaje.includes("ALL-IN")||s.mensaje.includes("sube")) playChip(); if(s.mensaje.includes("Showdown")) playWin(); ultimoMensaje=s.mensaje; }
  document.getElementById('estado').innerText=s.jugadores.length+"/5 • "+s.admin;
  document.getElementById('mensaje').innerText=s.mensaje+(s.ganadorMano?" | "+s.ganadorMano:"");
  document.getElementById('bote').innerText=s.bote; document.getElementById('apuestaActual').innerText=s.apuestaActual; document.getElementById('faseTop').innerText=s.fase.toUpperCase(); document.getElementById('numMano').innerText=s.numMano||1;
  const mesa=document.getElementById('cartasMesa'); mesa.innerHTML='';
  if(s.mesa.length===0) mesa.innerHTML='<p style="color:#d1fae5;font-size:12px">Esperando a que el admin empiece</p>';
  s.mesa.forEach(c=>mesa.appendChild(cartaDiv(c)));
  const yo=s.jugadores.find(j=>j.nombre===miNombre);
  const mis=document.getElementById('misCartas'); mis.innerHTML='';
  if(yo && yo.cartas && yo.cartas.length && yo.cartas[0].txt!=="🂠"){ yo.cartas.forEach(c=>mis.appendChild(cartaDiv(c))); document.getElementById('miInfo').innerHTML="💰 <b>"+yo.fichas+" fichas</b> • Apuesta: "+yo.apuesta+(yo.evaluacion && s.fase==='fin' ? " • <b style='color:#f5c542'>"+yo.evaluacion.nombre+"</b>" : ""); }
  else if(yo){ mis.innerHTML='<p style="color:#888">Esperando reparto...</p>'; document.getElementById('miInfo').innerHTML="💰 <b>"+yo.fichas+" fichas</b>"; }
  const seats=document.getElementById('seats'); seats.innerHTML='';
  const miIdx=s.jugadores.findIndex(j=>j.nombre===miNombre);
  s.jugadores.forEach((j,i)=>{
    let pos = (i - miIdx + s.jugadores.length) % s.jugadores.length; if(miIdx===-1) pos=i;
    const posClass = s.jugadores.length===5 ? "pos"+pos : s.jugadores.length===4 ? ["pos0","pos1","pos2","pos3"][pos] : s.jugadores.length===3 ? ["pos0","pos2","pos3"][pos] : ["pos0","pos2"][pos];
    const div=document.createElement('div'); div.className='seat '+posClass+(i===s.turno && s.fase!=='esperando' && s.fase!=='fin'?' active':'')+(j.retirado?' out':'')+(j.nombre===miNombre?' me':'');
    const esDealer = s.numMano>0 && (i===((s.numMano-1)%s.jugadores.length));
    div.innerHTML='<div class="ava">'+(j.avatar||"🙂")+(esDealer?'<div class="dealer">D</div>':'')+'</div><div class="name">'+(j.esAdmin?"👑 ":"")+j.nombre+'</div><br><div class="stack">💰 '+j.fichas+'</div>'+(j.apuesta>0?'<br><div class="bet">'+j.apuesta+'</div>':'')+(s.fase==='fin'&&j.cartas&&j.nombre!==miNombre?'<div style="font-size:10px;background:#000;padding:2px 6px;border-radius:10px;margin-top:2px">'+j.cartas.map(c=>c.txt).join(" ")+'</div>':'')+(soyAdmin && j.nombre!==miNombre?'<div><button style="font-size:10px;padding:3px 8px;border-radius:8px;border:none;background:#dc262
