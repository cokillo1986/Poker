<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PokerStars - Texas Hold'em</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0f;color:#fff;overflow-x:hidden}
.topbar{background:#000;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:3px solid #d4af37;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px;letter-spacing:1px}.logo i{color:#d4af37;font-style:normal}.logo small{font-size:10px;color:#aaa;display:block;letter-spacing:3px}
.pill{background:#1c1c22;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid #333}
.pill.on{color:#4ade80}
.lobby{max-width:480px;margin:18px auto;padding:0 14px}
.card{background:linear-gradient(180deg,#17171f,#101016);border:1px solid #2a2a35;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.card h1{margin:0;font-size:30px;text-align:center}.card p.sub{text-align:center;color:#9ca3af;margin:6px 0 14px;font-size:13px}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;font-size:16px;margin:8px 0;outline:none}
input:focus{border-color:#d4af37}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;margin:7px 0;letter-spacing:.5px}
.btn-gold{background:linear-gradient(180deg,#ffe27a,#d4af37);color:#000;box-shadow:0 4px 0 #8a6d1a}
.btn-blue{background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff}
.btn-dark{background:#23232e;color:#fff;border:1px solid #333}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:10px 0}
.av{font-size:24px;padding:10px 0;background:#000;border:2px solid #2a2a35;border-radius:12px;cursor:pointer;text-align:center}
.av.sel{border-color:#d4af37;background:#3a2f00;transform:scale(1.1)}
.label{font-weight:800;font-size:14px;margin-top:12px}
.soundRow{display:flex;justify-content:space-between;align-items:center;background:#000;padding:12px;border-radius:12px;margin:10px 0;font-size:14px}

/* === MESA POKERSTARS === */
.game{display:none;max-width:520px;margin:0 auto;padding:8px 10px 20px}
.infoBar{display:flex;justify-content:space-between;align-items:center;background:#14141b;border:1px solid #2a2a35;border-radius:12px;padding:8px 12px;font-size:13px}
.infoBar b{color:#facc15;letter-spacing:2px}
.adminBar{background:linear-gradient(180deg,#facc15,#d4af37);color:#000;border-radius:12px;padding:10px;font-weight:800;text-align:center;margin:8px 0;display:none}
.adminBar button{width:49%;display:inline-block;padding:12px}
.table{position:relative;height:480px;margin:14px 0 8px;background:#000;border-radius:50%;padding:14px;box-shadow:0 15px 40px rgba(0,0,0,.7)}
.wood{position:absolute;inset:0;background:radial-gradient(ellipse at center,#4a2c14 0%,#2a1a0a 55%,#1a0f05 100%);border-radius:50%;border:6px solid #1a0f05}
.felt{position:absolute;inset:16px;background:radial-gradient(ellipse at 50% 35%,#1e8a4d 0%,#11653a 55%,#0a3d22 100%);border-radius:50%;border:2px solid rgba(255,255,255,.15);overflow:hidden}
.felt:before{content:"POKERSTARS";position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;color:rgba(255,255,255,.08);letter-spacing:6px;white-space:nowrap}
.felt:after{content:"TEXAS HOLD'EM";position:absolute;top:56%;left:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:4px;color:rgba(255,255,255,.12)}
.center{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;width:100%;z-index:3}
.pot{font-weight:900;font-size:17px;text-shadow:0 2px 4px #000}.pot span{color:#ffe27a;font-size:20px}
.chipsPot{display:flex;justify-content:center;gap:2px;margin:6px 0}
.chip{width:22px;height:22px;border-radius:50%;border:2.5px dashed #fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.chip.white{background:#e5e7eb;color:#111}.chip.red{background:#dc2626}.chip.blue{background:#2563eb}.chip.black{background:#111}.chip.green{background:#16a34a}
.community{display:flex;gap:6px;justify-content:center;margin:8px 0;min-height:64px}
.carta{width:44px;height:62px;background:#fff;color:#111;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-weight:900;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.5);animation:repartir .35s ease}
.carta small{font-size:12px}
.carta.roja{color:#d21f2b} .carta.back{background:linear-gradient(135deg,#b91c1c,#7f1d1d);color:#fff;font-size:18px}
@keyframes repartir{from{transform:translateY(-20px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.msg{text-align:center;font-weight:700;font-size:13px;min-height:20px;margin:4px 0;color:#fde68a;text-shadow:0 1px 2px #000}
/* ASIENTOS ALREDEDOR */
.seat{position:absolute;width:96px;z-index:5;text
